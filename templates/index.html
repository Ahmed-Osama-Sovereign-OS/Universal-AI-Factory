<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahmed Osama AI Factory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: radial-gradient(circle, #1e293b 0%, #0f172a 100%); min-height: 100vh; color: white; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div class="glass p-8 rounded-2xl shadow-2xl w-full max-w-lg">
        <h1 class="text-3xl font-bold text-blue-400 mb-2 text-center">مصنع أحمد أسامة للذكاء الاصطناعي</h1>
        <p class="text-gray-400 text-center mb-6">اكتب وصفاً لأي برنامج أو منصة تريدها وسنقوم ببنائها فوراً</p>
        
        <textarea id="desc" rows="5" class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 focus:border-blue-500 focus:outline-none text-white placeholder-slate-500 mb-4" placeholder="مثلاً: متصفح إنترنت خارق يضم حماية ضد التجسس وواجهة زجاجية..."></textarea>
        
        <button onclick="startBuild()" id="btn" class="w-full bg-blue-600 hover:bg-blue-500 transition-all text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-900/20">ابدأ عملية البناء الخارقة</button>
        
        <div id="status" class="mt-6 hidden">
            <div class="flex items-center justify-center space-x-2 animate-pulse">
                <div class="h-2 w-2 bg-blue-400 rounded-full"></div>
                <p class="text-blue-400 text-sm mr-2" id="statusText">جاري الاتصال بالمصنع السحابي...</p>
            </div>
        </div>
    </div>

    <script>
        async function startBuild() {
            const desc = document.getElementById('desc').value;
            const btn = document.getElementById('btn');
            const status = document.getElementById('status');
            const statusText = document.getElementById('statusText');

            if (!desc) return alert("من فضلك اكتب وصف البرنامج!");

            btn.disabled = true;
            btn.classList.add('opacity-50');
            status.classList.remove('hidden');

            try {
                const response = await fetch('/build', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({description: desc})
                });
                const data = await response.json();
                statusText.innerText = data.message;
            } catch (err) {
                statusText.innerText = "حدث خطأ في الاتصال بالسيرفر.";
            }
        }
    </script>
</body>
</html>
